<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="254px" preserveAspectRatio="none" style="width:496px;height:254px;background:#FFFFFF;" version="1.1" viewBox="0 0 496 254" width="496px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="444" x="19" y="23.1318">AttendanceRecord Class Diagram - School Management System</text><!--class AttendanceRecord--><g id="elem_AttendanceRecord"><rect codeLine="25" fill="#FFFFFF" height="203.085" id="AttendanceRecord" rx="2.5" ry="2.5" style="stroke:#9CA3AF;stroke-width:0.5;" width="160" x="7" y="44.0986"/><text fill="#111827" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="118" x="28" y="62.2305">AttendanceRecord</text><line style="stroke:#9CA3AF;stroke-width:0.5;" x1="8" x2="166" y1="70.1973" y2="70.1973"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="58" x="13" y="87.3291">-id: bigint</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="98" x="13" y="103.4277">-class_id: bigint</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="113" x="13" y="119.5264">-student_id: bigint</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="127" x="13" y="135.625">-recorded_by: bigint</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="148" x="13" y="151.7236">-attendance_date: date</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="86" x="13" y="167.8223">-status: string</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="70" x="13" y="183.9209">-notes: text</text><line style="stroke:#9CA3AF;stroke-width:1.0;" x1="8" x2="166" y1="190.8877" y2="190.8877"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="96" x="13" y="208.0195">+courseClass()</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="65" x="13" y="224.1182">+student()</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="91" x="13" y="240.2168">+recordedBy()</text></g><g id="elem_GMN3"><path d="M227,95.5986 L227,141.5986 L167.21,145.5986 L227,149.5986 L227,195.291 A0,0 0 0 0 227,195.291 L489,195.291 A0,0 0 0 0 489,195.291 L489,105.5986 L479,95.5986 L227,95.5986 A0,0 0 0 0 227,95.5986 " fill="#FFF7BF" style="stroke:#D6B656;stroke-width:0.5;"/><path d="M479,95.5986 L479,105.5986 L489,105.5986 L479,95.5986 " fill="#FFF7BF" style="stroke:#D6B656;stroke-width:0.5;"/><text fill="#111827" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="237" x="233" y="112.7925">AttendanceRecord stores the attendance</text><text fill="#111827" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="185" x="233" y="127.7412">status of a student for a specific</text><text fill="#111827" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="84" x="233" y="142.6899">class session.</text><text fill="#111827" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4" x="233" y="157.6387">&#160;</text><text fill="#111827" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="212" x="233" y="172.5874">It links the record to the class group,</text><text fill="#111827" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="241" x="233" y="187.5361">the student, and the user who recorded it.</text></g><!--SRC=[RL91RXin3BplAmZaqg1n4BUeq_fcErWqX_PGFy2W9UukOLao92vIj-ZVIwsSPclx8e2ZqGn7fB0uWeK8UOlUq0yo8LfOEKm9dXZRY7kOmDfq8JZuXXvRsfCNM1-JqBwg73K24Y1osmbOZcI4WwywjWI6et5KLMd7_e1PocHXjOkyxOMUJV1h_aNmCAAa3cruOTz2WoxHwCQn9paU2